<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie — lepato</title>
    <meta name="description" content="lepato - Auteur compositeur interprète. Pop-rock francophone avec groove, funk et textes engagés.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <!-- NAV -->
    <nav id="nav">
        <a href="index.html" class="nav-logo">lepato</a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html#about" onclick="closeNav()">À propos</a></li>
            <li><a href="index.html#nouvelles" onclick="closeNav()">Nouvelles</a></li>
            <li><a href="index.html#music" onclick="closeNav()">Musique</a></li>
            <li><a href="index.html#equipe" onclick="closeNav()">Équipe</a></li>
            <li><a href="galerie.html">Photos</a></li>
            <li><a href="index.html#connect" onclick="closeNav()">Contact</a></li>
        </ul>
        <button class="burger" id="burger" onclick="toggleNav()" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <!-- GALLERY -->
    <section class="gallery gallery-page" id="photos">
        <div class="reveal">
            <span class="section-label">Galerie</span>
            <h2 class="section-title">En images</h2>
        </div>
        <div class="gallery-grid">
            <div class="gallery-item wide reveal">
                <img src="images/ep-cover-shoot.jpg" alt="lepato, guitare à l'épaule, devant un bâtiment industriel" loading="lazy">
                <span class="gallery-credit">Photo : Émilie Pelletier</span>
            </div>
            <div class="gallery-item reveal">
                <img src="images/emilie-1.jpg" alt="lepato traverse la rue avec sa guitare" loading="lazy">
                <span class="gallery-credit">Photo : Émilie Pelletier</span>
            </div>
            <div class="gallery-item reveal">
                <img src="images/emilie-2.jpg" alt="lepato dans un cadre de porte" loading="lazy">
                <span class="gallery-credit">Photo : Émilie Pelletier</span>
            </div>
            <div class="gallery-item reveal">
                <img src="images/emilie-3.jpg" alt="lepato regarde vers le ciel dans une ruelle" loading="lazy">
                <span class="gallery-credit">Photo : Émilie Pelletier</span>
            </div>
            <div class="gallery-item reveal">
                <img src="images/emilie-4.jpg" alt="lepato à la guitare" loading="lazy">
                <span class="gallery-credit">Photo : Émilie Pelletier</span>
            </div>
            <div class="gallery-item reveal">
                <img src="images/emilie-5.jpg" alt="lepato appuyé à une rampe" loading="lazy">
                <span class="gallery-credit">Photo : Émilie Pelletier</span>
            </div>
            <div class="gallery-item wide reveal">
                <img src="images/banner.jpg" alt="lepato en ville">
            </div>
            <div class="gallery-item tall reveal">
                <img src="images/hat.jpg" alt="lepato en concert">
            </div>
            <div class="gallery-item reveal">
                <img src="images/photo2.jpg" alt="lepato portrait">
            </div>
            <div class="gallery-item reveal">
                <img src="images/shade.jpg" alt="lepato silhouette">
            </div>
            <div class="gallery-item reveal">
                <img src="images/hands.jpg" alt="lepato guitare">
            </div>
            <div class="gallery-item reveal">
                <img src="images/blue.jpg" alt="lepato portrait bleu">
            </div>
            <div class="gallery-item reveal">
                <img src="images/wood.jpg" alt="lepato acoustique">
            </div>
            <div class="gallery-item reveal">
                <img src="images/photo1.jpg" alt="lepato assis">
            </div>
            <div class="gallery-item reveal">
                <img src="images/pochette.jpg" alt="Et Puis? pochette">
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 lepato. Tous droits réservés.</p>
    </footer>

    <script>
        // Nav scroll effect
        const nav = document.getElementById('nav');
        window.addEventListener('scroll', () => {
            nav.classList.toggle('scrolled', window.scrollY > 60);
        });

        // Mobile nav
        function toggleNav() {
            document.getElementById('navLinks').classList.toggle('open');
        }
        function closeNav() {
            document.getElementById('navLinks').classList.remove('open');
        }

        // Scroll reveal
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, i) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, i * 120);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>

</body>
</html>
